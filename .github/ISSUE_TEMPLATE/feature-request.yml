name: Feature request
description: Suggest an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening: this tool reads the profile page in front of you. Bulk export, automated
        browsing, and anything touching LinkedIn's private APIs are deliberately out of scope.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need, not just the feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true
